name: test_workflow
on: push

jobs: 
    tests:
        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: ./demo_react

        steps:
            - name: Get code
              uses: actions/checkout@v3
            
            - name: Install NodeJS
              uses: actions/setup-node@v3
              with:
                node-version: 26

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test


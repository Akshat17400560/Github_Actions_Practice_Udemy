name: test_workflow
on: push

jobs: 
    tests:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v3
            
            - name: Install NodeJS
              uses: actions/setup-node@v3
              with:
                node-version: 18

            - name: Navigate to demo_react
              run: cd demo_react/

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test


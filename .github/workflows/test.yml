name: Deployment_workflow
on: push

jobs: 
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./demo_react

    steps:
      - name: Get code
        uses: actions/checkout@v6
            
      - name: Install NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./demo_react
    
    steps:
      - name: Get code
        uses: actions/checkout@v6
            
      - name: Install NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build
      
      - name: Deploy
        run: echo "Deploying..."




